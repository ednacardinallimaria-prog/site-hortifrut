<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Hortifruti Edna Góis - Frutas, verduras e legumes frescos com delivery em Itabaiana, Sergipe.">

    <title>Hortifruti Edna Góis | Frescor na sua mesa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <style>

        /* =====================================================
           CONFIGURAÇÕES GERAIS
        ===================================================== */

        :root {
            --verde: #176b3a;
            --verde-claro: #2fa45f;
            --verde-suave: #eaf7ee;

            --laranja: #f59e0b;
            --vermelho: #ef4444;

            --fundo: #f7faf7;
            --card: #ffffff;

            --texto: #17231b;
            --texto-secundario: #68736c;

            --borda: #e4ebe5;

            --sombra: 0 15px 40px rgba(22, 53, 35, 0.08);

            --radius: 20px;

            --transicao: 0.3s ease;
        }


        /* =====================================================
           MODO ESCURO
        ===================================================== */

        body.dark {
            --fundo: #101712;
            --card: #17221a;

            --texto: #f2f7f3;
            --texto-secundario: #aab6ad;

            --borda: #29372d;

            --verde-suave: #193a26;

            --sombra: 0 15px 40px rgba(0, 0, 0, 0.25);
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            font-family: "Inter", sans-serif;

            background: var(--fundo);
            color: var(--texto);

            line-height: 1.6;

            transition:
                background 0.3s ease,
                color 0.3s ease;
        }


        img {
            max-width: 100%;
            display: block;
        }


        a {
            text-decoration: none;
            color: inherit;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            cursor: pointer;
        }


        .container {
            width: min(1180px, 92%);
            margin: auto;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {
            position: sticky;
            top: 0;

            z-index: 1000;

            background: rgba(255, 255, 255, 0.92);

            backdrop-filter: blur(15px);

            border-bottom: 1px solid var(--borda);
        }


        body.dark header {
            background: rgba(16, 23, 18, 0.92);
        }


        .navbar {
            min-height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }


        .logo {
            display: flex;
            align-items: center;

            gap: 10px;

            color: var(--verde);

            font-size: 1.15rem;
            font-weight: 800;
        }


        .logo-icon {
            width: 42px;
            height: 42px;

            display: grid;
            place-items: center;

            border-radius: 13px;

            background: var(--verde-suave);

            font-size: 1.5rem;
        }


        .nav-links {
            display: flex;
            align-items: center;

            gap: 25px;

            color: var(--texto-secundario);

            font-size: 0.9rem;
            font-weight: 600;
        }


        .nav-links a {
            transition: var(--transicao);
        }


        .nav-links a:hover {
            color: var(--verde);
        }


        .header-actions {
            display: flex;
            align-items: center;

            gap: 10px;
        }


        .icon-btn {
            width: 43px;
            height: 43px;

            border: 1px solid var(--borda);

            background: var(--card);

            color: var(--texto);

            border-radius: 13px;

            display: grid;
            place-items: center;

            font-size: 1.1rem;

            transition: var(--transicao);
        }


        .icon-btn:hover {
            transform: translateY(-2px);

            border-color: var(--verde-claro);
        }


        .cart-button {
            position: relative;
        }


        .cart-count {
            position: absolute;

            top: -5px;
            right: -5px;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            background: var(--vermelho);

            color: white;

            font-size: 0.7rem;
            font-weight: 800;

            display: grid;
            place-items: center;
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            margin-top: 35px;

            min-height: 480px;

            border-radius: 30px;

            overflow: hidden;

            position: relative;

            display: flex;
            align-items: center;

            background:
                linear-gradient(
                    90deg,
                    rgba(7, 46, 24, 0.95),
                    rgba(7, 46, 24, 0.68),
                    rgba(7, 46, 24, 0.15)
                ),
                url("https://images.unsplash.com/photo-1610832958506-aa56368176cf?auto=format&fit=crop&w=1600&q=85")
                center/cover;
        }


        .hero-content {
            width: 600px;

            padding: 60px;

            color: white;
        }


        .badge {
            display: inline-flex;

            padding: 8px 13px;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(10px);

            font-size: 0.8rem;
            font-weight: 700;

            margin-bottom: 20px;
        }


        .hero h1 {
            font-size: clamp(2.4rem, 5vw, 4.5rem);

            line-height: 1.05;

            margin-bottom: 20px;
        }


        .hero h1 span {
            color: #b9f6c9;
        }


        .hero p {
            max-width: 500px;

            font-size: 1.05rem;

            color: rgba(255,255,255,0.85);

            margin-bottom: 30px;
        }


        .hero-buttons {
            display: flex;
            flex-wrap: wrap;

            gap: 12px;
        }


        .btn {
            border: none;

            padding: 14px 20px;

            border-radius: 13px;

            font-weight: 700;

            transition: var(--transicao);
        }


        .btn-primary {
            background: white;

            color: var(--verde);
        }


        .btn-primary:hover {
            transform: translateY(-3px);
        }


        .btn-whatsapp {
            background: #25d366;

            color: white;
        }


        .btn-whatsapp:hover {
            background: #1ebe5d;

            transform: translateY(-3px);
        }


        /* =====================================================
           BENEFÍCIOS
        ===================================================== */

        .benefits {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 15px;

            margin: 25px 0 60px;
        }


        .benefit {
            background: var(--card);

            border: 1px solid var(--borda);

            border-radius: 18px;

            padding: 20px;

            display: flex;
            align-items: center;

            gap: 14px;

            box-shadow: var(--sombra);
        }


        .benefit-icon {
            width: 45px;
            height: 45px;

            border-radius: 13px;

            display: grid;
            place-items: center;

            background: var(--verde-suave);

            font-size: 1.3rem;
        }


        .benefit strong {
            display: block;

            font-size: 0.9rem;
        }


        .benefit span {
            font-size: 0.75rem;

            color: var(--texto-secundario);
        }


        /* =====================================================
           SEÇÕES
        ===================================================== */

        .section {
            margin-bottom: 75px;
        }


        .section-header {
            display: flex;
            align-items: end;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 25px;
        }


        .section-title small {
            display: block;

            color: var(--verde-claro);

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            font-size: 0.7rem;

            margin-bottom: 5px;
        }


        .section-title h2 {
            font-size: clamp(1.8rem, 4vw, 2.6rem);

            line-height: 1.1;
        }


        .section-title p {
            margin-top: 8px;

            color: var(--texto-secundario);

            font-size: 0.9rem;
        }


        /* =====================================================
           BUSCA E FILTROS
        ===================================================== */

        .filters {
            display: flex;

            gap: 10px;

            margin-bottom: 25px;

            flex-wrap: wrap;
        }


        .search-box {
            flex: 1;

            min-width: 220px;

            position: relative;
        }


        .search-box input {
            width: 100%;

            padding: 14px 18px 14px 45px;

            border-radius: 14px;

            border: 1px solid var(--borda);

            background: var(--card);

            color: var(--texto);

            outline: none;

            transition: var(--transicao);
        }


        .search-box input:focus {
            border-color: var(--verde-claro);
        }


        .search-icon {
            position: absolute;

            left: 17px;
            top: 50%;

            transform: translateY(-50%);
        }
